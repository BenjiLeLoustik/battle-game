docs:
    title: Documentation
    subtitle: "Le guide complet du back-office : à quoi sert chaque page, comment créer un jeu en code ou sans code, et comment tout s'articule."
    search: "Rechercher un sujet… (touche /)"
    search_short: Rechercher…
    toc: Sommaire de la documentation
    empty: "Aucun résultat. Essaie un autre mot (ex. maintenance, badge, règle, publier)."
    open: Ouvrir la page
    home: Toute la documentation
    eyebrow: Centre d'aide du back-office
    read: Lire
    breadcrumb: Fil d'Ariane
    previous: Précédent
    next: Suivant
    group_intros:
        start: "Les bases du back-office et la gestion des accès de l'équipe."
        steering: "Suivre l'activité et gérer les jeux, catégories, rooms, bandeaux et badges."
        studio: "Créer un jeu de A à Z : en code, sans code, son apparence et sa publication."
        shop: "La boutique : produits, commandes, abonnements, pièces, vies et paiement Stripe."
        community: "Les joueurs, les salons de discussion et la modération."
        system: "Les réglages du site : pages, maintenance, langues, emails et temps réel."

<!DOCTYPE html>
<html lang="{lang}">
    <body style="margin: 0; padding: 32px 16px; background: #0B0D17; font-family: Inter, Arial, sans-serif; color: #E8EAF6">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
                <td align="center">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px">
                        <tr>
                            <td style="padding-bottom: 18px">
                                <a href="{site}" style="display: inline-block; padding: 6px 10px; border-radius: 8px; background: #7C5CFF; color: #FFFFFF; font-weight: 800; font-size: 14px; letter-spacing: 1px; text-decoration: none">BG</a>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 28px; border-radius: 16px; background: #121524; border: 1px solid #262B45">
                                <div style="font-size: 22px; font-weight: 700; padding-bottom: 14px; color: #FFFFFF">{title}</div>
                                <div style="font-size: 15px; line-height: 1.6; color: #C9CDE3">{content}</div>
                                <div style="padding-top: 22px">{button}</div>
                                <div style="font-size: 12px; line-height: 1.5; color: #8C93B5; padding-top: 18px">{note}</div>
                            </td>
                        </tr>
                        <tr>
                            <td style="font-size: 12px; color: #6B7194; padding-top: 18px; text-align: center">
                                BattleGame · {year}<br>{unsubscribe}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
